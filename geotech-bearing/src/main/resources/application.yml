server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: bearing-capacity-service
  # 运行时固定 PostgreSQL 16（连接信息由环境变量给出，docker-compose 已配好默认值）
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/geotech}
    username: ${SPRING_DATASOURCE_USERNAME:geotech}
    password: ${SPRING_DATASOURCE_PASSWORD:geotech}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
