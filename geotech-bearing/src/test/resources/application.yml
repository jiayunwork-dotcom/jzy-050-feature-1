# 测试环境：H2 的 PostgreSQL 兼容模式，无需起外部数据库即可跑全部自动化测试。
spring:
  datasource:
    url: jdbc:h2:mem:geotech-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC

logging:
  level:
    root: WARN
    com.geotech: INFO
